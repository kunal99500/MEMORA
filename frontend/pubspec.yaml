name: memora
description: MEMORA — visual memory for the physical world.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  speech_to_text: 7.3.0
  file_picker: ^8.1.2
  flutter_tts: ^4.2.5
  gal: ^2.3.3
  image: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# file_picker 8.x compiles against SDK 34 and is incompatible with lifecycle 2.0.35.
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.22

flutter:
  uses-material-design: true
